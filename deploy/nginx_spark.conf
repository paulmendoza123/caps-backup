# nginx reverse-proxy config for SPARK, sitting in front of gunicorn.
#
# HOW TO USE:
#   1. Edit the "root" path below to match where you cloned the repo on the Pi.
#   2. Copy onto the Pi and enable it:
#        sudo cp deploy/nginx_spark.conf /etc/nginx/sites-available/spark
#        sudo ln -s /etc/nginx/sites-available/spark /etc/nginx/sites-enabled/spark
#   3. (Optional but recommended) disable the nginx default site so it
#      doesn't conflict:
#        sudo rm -f /etc/nginx/sites-enabled/default
#   4. Test the config, then reload:
#        sudo nginx -t
#        sudo systemctl reload nginx
#   5. SPARK should now be reachable on port 80 (just the Pi's IP, no ":5000")
#      as long as the gunicorn service (deploy/spark.service) is running.
#
# This expects gunicorn to be bound to 127.0.0.1:5000 (the default in
# deploy/spark.service) — nginx is the only thing exposed on the network.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;  # allow question-bank / essay bulk-upload files

    # Serve static files (CSS/JS) directly instead of through gunicorn — faster,
    # and takes load off the app server.
    location /static/ {
        alias /home/pi/capss/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exam pages poll status/heartbeat frequently and submissions can take
        # a moment on a loaded Pi — give some breathing room over the default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
